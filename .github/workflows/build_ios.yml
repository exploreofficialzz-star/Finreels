name: Build iOS

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Flutter ───────────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      # ── Dependencies ──────────────────────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── CocoaPods ─────────────────────────────────────────────────────────────
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
        env:
          COCOAPODS_DISABLE_STATS: true

      # ── Code Signing (release tags only) ─────────────────────────────────────
      - name: Import certificates and provisioning profile
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert \
            -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      # ── Build iOS (no codesign — PRs and pushes) ──────────────────────────────
      - name: Build iOS (no codesign)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: flutter build ios --debug --no-codesign

      # ── Build IPA (release tags only) ─────────────────────────────────────────
      - name: Build iOS IPA
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          flutter build ios --release --no-codesign
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/finreels.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ secrets.IOS_CODE_SIGN_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}"
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/finreels.xcarchive \
            -exportOptionsPlist ../scripts/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/finreels-ipa

      # ── Upload IPA ────────────────────────────────────────────────────────────
      - name: Upload IPA
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: finreels-release-ipa
          path: ${{ runner.temp }}/finreels-ipa/*.ipa
          retention-days: 90

      # ── Clean up keychain ──────────────────────────────────────────────────────
      - name: Clean up keychain
        if: always() && startsWith(github.ref, 'refs/tags/')
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
